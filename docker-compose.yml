name: hr-it-helpdesk

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-admin}
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD:-change-me-readonly}   # used by db/init/03_readonly_role.sh
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.20.0
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  mcp-server:
    build: ./mcp_server
    environment:
     
      MCP_DATABASE_URL: postgresql://mcp_readonly:${MCP_DB_PASSWORD:-change-me-readonly}@postgres:5432/${POSTGRES_DB:-helpdesk}
      MCP_PORT: "8001"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      MCP_SERVER_URL: http://mcp-server:8001/mcp
      POLICIES_DIR: /app/policies
      TICKETS_FILE: /data/tickets/tickets.jsonl
    volumes:
      - ./policies:/app/policies:ro          # edit a policy + restart agent = re-indexed
      - ./data/tickets:/data/tickets          # mock tickets land here
      - ./eval_results:/workspace/eval_results
      - ./README.md:/workspace/README.md      # run_eval writes results into the README
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      mcp-server:
        condition: service_started
    ports:
      - "8000:8000"

volumes:
  pgdata:
  qdrant_data:
